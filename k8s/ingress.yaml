apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-service-ingress
  namespace: ticketing
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - tickets.yourdomain.com
    secretName: ticket-service-tls
  rules:
  - host: tickets.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ticket-service
            port:
              number: 8000
