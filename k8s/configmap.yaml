apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-service-config
  namespace: ticketing
data:
  APP_NAME: "FastAPI Ticketing Service"
  APP_ENV: "production"
  DEBUG: "false"
  API_V1_STR: "/api/v1"
  POSTGRES_SERVER: "ticket-postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ticket_db"
  REDIS_URL: "redis://ticket-redis-service:6379/0"
  RATE_LIMIT_PER_MINUTE: "60"
  ALLOWED_ORIGINS: "https://tickets.yourdomain.com"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
