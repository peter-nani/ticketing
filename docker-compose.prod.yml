services:
  db:
    image: postgres:15-alpine
    container_name: ticket_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ticket_redis_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  migrate:
    image: ticketing-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_migrate_prod
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ticketing-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_api_prod
    restart: always
    env_file:
      - .env
    environment:
      TICKET_IMAGE_STORAGE_PATH: ${TICKET_IMAGE_STORAGE_PATH:-/app/storage/images}
      COMMENT_IMAGE_MAX_BYTES: ${COMMENT_IMAGE_MAX_BYTES:-8388608}
    volumes:
      - ticket_images:/app/storage/images
    ports:
      - "${HOST:-192.168.2.245}:${PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data_prod:
  ticket_images:
